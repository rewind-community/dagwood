name: tag-and-release

on:
  push:
    branches:
      - main
    paths: 'lib/*/version.rb'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # main

      - name: Set up Ruby 2.7
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1
        with:
          ruby-version: 2.7

      - name: Get version
        id: get_version
        run: |
          version_file=$(find ./lib -name version.rb)
          version=$(grep VERSION $version_file |cut -f 2 -d= |tr -d \'|tr -d [:space:])
          echo version=$version >> $GITHUB_OUTPUT
          echo version_tag=v$version >> $GITHUB_OUTPUT

      - name: Create tagger app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.TAGGER_APP_ID }}
          private-key: ${{ secrets.TAGGER_PRIVATE_KEY }}

      - name: Tag commit
        uses: tvdias/github-tagger@ed7350546e3e503b5e942dffd65bc8751a95e49d # v0.0.2
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          tag: "${{steps.get_version.outputs.version_tag}}"

      - name: Upload to Rubygems
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          set +e
          mkdir -p ~/.gem
          touch ~/.gem/credentials
          chmod 600 ~/.gem/credentials
          echo ":rubygems_api_key: ${RUBYGEMS_API_KEY}" >> ~/.gem/credentials

          gemspec=$(ls *gemspec* | head -1)
          gem build $gemspec
          gem_name=$(ls -t *.gem | head -1)
          output=$(gem push *.gem)

          if [[ $output != *"Successfully"* ]]; then
            echo "Error uploading to Rubygems: $output"
            rm -f ~/.gem/credentials
            exit 1
          else
            echo "Successfully uploaded to Rubygems: $output"
            rm -f ~/.gem/credentials
          fi

      - name: Extract from changelog
        id: extract_changes
        run: |
          # Must use a temporary file or it loses the formatting
          VERSION=${{steps.get_version.outputs.version}}; awk "/## \[$VERSION\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > REL-BODY.md

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{steps.get_version.outputs.version_tag}}
          artifacts: "*.gem, CHANGELOG.md"
          bodyFile: "REL-BODY.md"
          token: ${{ steps.app-token.outputs.token }}
          # An immutable release seals on publish, so assets have to land while
          # it is still a draft. This creates a draft, uploads, then publishes.
          immutableCreate: true
          # Upload failures were warnings, so a release could publish empty and green.
          artifactErrorsFailBuild: true

      - name: Delete stranded draft release
        if: ${{ failure() && steps.create_release.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{steps.get_version.outputs.version_tag}}
        run: |
          set -o pipefail
          # The releases list lags creation by a second or two, so poll before giving up.
          ids=""
          listed=""
          for _ in 1 2 3 4 5; do
            if ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[] | select(.draft and .tag_name == env.TAG) | .id'); then
              listed=yes
              [ -n "$ids" ] && break
            else
              listed=""
            fi
            sleep 3
          done
          if [ -z "$listed" ]; then
            echo "Could not list releases for ${TAG}; a draft may be stranded." >&2
            exit 1
          fi
          if [ -z "$ids" ]; then
            echo "No draft release for ${TAG}; nothing to clean up."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting stranded draft ${id} for ${TAG}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
